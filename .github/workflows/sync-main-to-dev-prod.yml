name: Sync main to dev and prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_branch:
          - dev
          - prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main into ${{ matrix.target_branch }}
        id: merge_main
        run: |
          set -euo pipefail

          git fetch origin main "${{ matrix.target_branch }}"
          git checkout "${{ matrix.target_branch }}"
          if ! git merge --no-ff "origin/main" -m "merge: sync main into ${{ matrix.target_branch }}"; then
            echo "has_conflict=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          git push origin "HEAD:${{ matrix.target_branch }}"

      - name: Create issue on sync failure
        if: failure() && steps.merge_main.outputs.has_conflict == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Sync conflict: main -> ${{ matrix.target_branch }}',
              body: [
                'Automatic sync from `main` to `${{ matrix.target_branch }}` failed due to a merge conflict.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Please resolve the conflict manually and merge `main` into the target branch.'
              ].join('\n')
            })
