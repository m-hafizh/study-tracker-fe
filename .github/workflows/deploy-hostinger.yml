name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Add SPA fallback for Apache
        run: |
          cat > dist/.htaccess << 'EOF'
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF

      - name: Prepare SSH key
        env:
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          HOSTINGER_SSH_PASSPHRASE: ${{ secrets.HOSTINGER_SSH_PASSPHRASE }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          raw_key="$HOSTINGER_SSH_PRIVATE_KEY"

          if [ -z "${raw_key//[[:space:]]/}" ]; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY is empty or missing. Set it in repository Actions secrets."
            exit 1
          fi

          # Remove accidental wrapping quotes when the key was pasted as a JSON/string literal.
          if [[ "$raw_key" == \"*\" ]]; then
            raw_key="${raw_key#\"}"
            raw_key="${raw_key%\"}"
          elif [[ "$raw_key" == \'*\' ]]; then
            raw_key="${raw_key#\'}"
            raw_key="${raw_key%\'}"
          fi

          if echo "$raw_key" | grep -Eq '^(ssh-(rsa|ed25519)|ecdsa-sha2-)'; then
            echo "::error::HOSTINGER_SSH_PRIVATE_KEY looks like a public key. Use the PRIVATE key (BEGIN ... PRIVATE KEY), not .pub."
            exit 1
          fi

          write_key_raw() {
            printf '%s' "$raw_key" | tr -d '\r' > ~/.ssh/hostinger_key
          }

          write_key_escaped() {
            printf '%b' "$raw_key" | tr -d '\r' > ~/.ssh/hostinger_key
          }

          write_key_base64() {
            printf '%s' "$raw_key" | tr -d '\r\n\t ' | base64 -d > ~/.ssh/hostinger_key
          }

          is_valid_key() {
            ssh-keygen -y -f ~/.ssh/hostinger_key >/dev/null 2>&1
          }

          if echo "$raw_key" | grep -q '\\n'; then
            write_key_escaped
          else
            write_key_raw
          fi
          chmod 600 ~/.ssh/hostinger_key

          if ! is_valid_key; then
            write_key_base64 >/dev/null 2>&1 || true
            chmod 600 ~/.ssh/hostinger_key
          fi

          if ! is_valid_key && [ -n "$HOSTINGER_SSH_PASSPHRASE" ]; then
            ssh-keygen -p -P "$HOSTINGER_SSH_PASSPHRASE" -N "" -f ~/.ssh/hostinger_key >/dev/null 2>&1 || true
            chmod 600 ~/.ssh/hostinger_key
          fi

          if ! is_valid_key; then
            echo "::error::Cannot parse HOSTINGER_SSH_PRIVATE_KEY as a valid private key. Use one of: (1) raw multiline private key, (2) same key with literal \\n, or (3) base64 of private key text."
            echo "::error::Fundamental check: the matching public key must already be in ~/.ssh/authorized_keys on Hostinger for HOSTINGER_SSH_USER."
            exit 1
          fi

      - name: SSH preflight check
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          ssh-keyscan -p "$HOSTINGER_SSH_PORT" -H "$HOSTINGER_SSH_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/hostinger_key \
            -o StrictHostKeyChecking=yes \
            -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "whoami && pwd && mkdir -p '$HOSTINGER_DEPLOY_PATH'"

      - name: Deploy dist to Hostinger
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/hostinger_key -o StrictHostKeyChecking=yes -p $HOSTINGER_SSH_PORT" \
            dist/ \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$HOSTINGER_DEPLOY_PATH/"
