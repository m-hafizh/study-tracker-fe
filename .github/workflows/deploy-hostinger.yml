name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-frontend
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Add SPA fallback for Apache
        run: |
          cat > dist/.htaccess << 'EOF'
          RewriteEngine On
          RewriteBase /
          RewriteRule ^index\.html$ - [L]
          RewriteCond %{REQUEST_FILENAME} !-f
          RewriteCond %{REQUEST_FILENAME} !-d
          RewriteRule . /index.html [L]
          EOF

      - name: Prepare SSH key
        env:
          HOSTINGER_SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Support both multiline keys and keys pasted with literal \n.
          if echo "$HOSTINGER_SSH_PRIVATE_KEY" | grep -q '\\n'; then
            printf '%b' "$HOSTINGER_SSH_PRIVATE_KEY" > ~/.ssh/hostinger_key
          else
            printf '%s' "$HOSTINGER_SSH_PRIVATE_KEY" > ~/.ssh/hostinger_key
          fi
          chmod 600 ~/.ssh/hostinger_key

          if ! ssh-keygen -y -f ~/.ssh/hostinger_key >/dev/null 2>&1; then
            echo "::error::Invalid HOSTINGER_SSH_PRIVATE_KEY format. Paste the full private key (including BEGIN/END lines) as a multiline GitHub secret."
            exit 1
          fi

      - name: SSH preflight check
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          ssh-keyscan -p "$HOSTINGER_SSH_PORT" -H "$HOSTINGER_SSH_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/hostinger_key \
            -o StrictHostKeyChecking=yes \
            -p "$HOSTINGER_SSH_PORT" \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST" \
            "whoami && pwd && mkdir -p '$HOSTINGER_DEPLOY_PATH'"

      - name: Deploy dist to Hostinger
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/hostinger_key -o StrictHostKeyChecking=yes -p $HOSTINGER_SSH_PORT" \
            dist/ \
            "$HOSTINGER_SSH_USER@$HOSTINGER_SSH_HOST:$HOSTINGER_DEPLOY_PATH/"
