name: Deploy FE to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - "**"
      - .github/workflows/deploy-hostinger-fe.yml
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-fe
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build FE
        run: pnpm build

      - name: Create deployment artifact
        run: tar -czf release.tar.gz dist

      - name: Upload artifact to Hostinger (attempt 1)
        id: upload_artifact_attempt_1
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          source: release.tar.gz
          target: "~/"
          timeout: 120s
          command_timeout: 15m

      - name: Upload artifact to Hostinger (attempt 2)
        if: steps.upload_artifact_attempt_1.outcome == 'failure'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          source: release.tar.gz
          target: "~/"
          timeout: 120s
          command_timeout: 15m

      - name: Deploy FE artifact on Hostinger (attempt 1)
        id: deploy_artifact_attempt_1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        env:
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          envs: HOSTINGER_DEPLOY_PATH
          timeout: 120s
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail

            RELEASE_FILE="$HOME/release.tar.gz"

            if [ ! -f "$RELEASE_FILE" ]; then
              echo "Release artifact not found at $RELEASE_FILE"
              exit 1
            fi

            if [ -z "${HOSTINGER_DEPLOY_PATH:-}" ]; then
              echo "HOSTINGER_DEPLOY_PATH is empty"
              exit 1
            fi

            mkdir -p "$HOSTINGER_DEPLOY_PATH"

            # Remove old static files before publishing new build.
            find "$HOSTINGER_DEPLOY_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

            tar -xzf "$RELEASE_FILE" -C "$HOSTINGER_DEPLOY_PATH"
            rm -f "$RELEASE_FILE"

      - name: Deploy FE artifact on Hostinger (attempt 2)
        if: steps.deploy_artifact_attempt_1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        env:
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          envs: HOSTINGER_DEPLOY_PATH
          timeout: 120s
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail

            RELEASE_FILE="$HOME/release.tar.gz"

            if [ ! -f "$RELEASE_FILE" ]; then
              echo "Release artifact not found at $RELEASE_FILE"
              exit 1
            fi

            if [ -z "${HOSTINGER_DEPLOY_PATH:-}" ]; then
              echo "HOSTINGER_DEPLOY_PATH is empty"
              exit 1
            fi

            mkdir -p "$HOSTINGER_DEPLOY_PATH"

            # Remove old static files before publishing new build.
            find "$HOSTINGER_DEPLOY_PATH" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

            tar -xzf "$RELEASE_FILE" -C "$HOSTINGER_DEPLOY_PATH"
            rm -f "$RELEASE_FILE"
