services:
  fe-dev:
    build:
      context: .
      target: dev
    image: study-tracker-fe:dev
    ports:
      - "${FE_DEV_PORT:-5173}:5173"
    environment:
      # This value is used by browser-side code, so default to a host-resolvable URL.
      VITE_BASE_API_URL: ${DOCKER_VITE_BASE_API_URL:-http://localhost:3003}
      VITE_PRIVATE_API_KEY: ${VITE_PRIVATE_API_KEY:-}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    volumes:
      - ./:/app
      - fe_node_modules:/app/node_modules
      - fe_pnpm_store:/pnpm/store
    extra_hosts:
      - host.docker.internal:host-gateway

  fe-prod:
    build:
      context: .
      target: prod
      args:
        VITE_BASE_API_URL: ${DOCKER_VITE_BASE_API_URL:-http://localhost:3003}
        VITE_PRIVATE_API_KEY: ${VITE_PRIVATE_API_KEY:-}
    image: study-tracker-fe:prod
    ports:
      - "${FE_PROD_PORT:-8080}:80"
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles:
      - prod

volumes:
  fe_node_modules:
  fe_pnpm_store: