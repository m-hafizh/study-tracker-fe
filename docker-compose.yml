services:
  fe-dev:
    build:
      context: .
      target: dev
    image: study-tracker-fe:dev
    ports:
      - "${FE_DEV_PORT:-5173}:5173"
    environment:
      # Empty base URL means browser uses same-origin /v1 requests.
      VITE_BASE_API_URL: "${DOCKER_VITE_BASE_API_URL:-}"
      # Vite dev server proxies /v1 to this backend target.
      VITE_DEV_PROXY_TARGET: ${DOCKER_VITE_DEV_PROXY_TARGET:-http://host.docker.internal:3003}
      VITE_PRIVATE_API_KEY: ${VITE_PRIVATE_API_KEY:-}
      VITE_ALLOWED_HOSTS: ${DOCKER_VITE_ALLOWED_HOSTS:-localhost,127.0.0.1,srv1632763.hstgr.cloud}
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-true}
    volumes:
      - ./:/app
      - fe_node_modules:/app/node_modules
      - fe_pnpm_store:/pnpm/store
    extra_hosts:
      - host.docker.internal:host-gateway

  fe-prod:
    build:
      context: .
      target: prod
      args:
        VITE_BASE_API_URL: "${DOCKER_VITE_BASE_API_URL:-}"
        VITE_PRIVATE_API_KEY: ${VITE_PRIVATE_API_KEY:-}
    image: study-tracker-fe:prod
    ports:
      - "${FE_PROD_PORT:-8080}:80"
    extra_hosts:
      - host.docker.internal:host-gateway
    profiles:
      - prod

volumes:
  fe_node_modules:
  fe_pnpm_store: